<style>
  html, body { background: #000; color: #fff; }
  body { font-family: 'DM Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  /* slim scrollbar */
  .scroll::-webkit-scrollbar { width: 12px; height: 12px; }
  .scroll::-webkit-scrollbar-thumb { background: #4a4a4a; border-radius: 999px; border: 3px solid transparent; background-clip: content-box; }
  .scroll::-webkit-scrollbar-thumb:hover { background: #6a6a6a; border: 3px solid transparent; background-clip: content-box; }
  .scroll::-webkit-scrollbar-track { background: transparent; }

  /* eq bars */
  .eq { display: inline-flex; gap: 2px; align-items: end; height: 14px; width: 14px; }
  .eq span { width: 2.5px; background: #1ED760; border-radius: 1px; animation: eqAnim 0.9s ease-in-out infinite; }
  .eq span:nth-child(1) { animation-delay: 0.0s; height: 60%; }
  .eq span:nth-child(2) { animation-delay: 0.2s; height: 100%; }
  .eq span:nth-child(3) { animation-delay: 0.4s; height: 40%; }
  .eq span:nth-child(4) { animation-delay: 0.1s; height: 80%; }
  @keyframes eqAnim { 0%,100% { transform: scaleY(0.4); transform-origin: bottom; } 50% { transform: scaleY(1); transform-origin: bottom; } }

  /* track row hover reveals play */
  .row .row-num { display: block; }
  .row .row-play { display: none; }
  .row:hover .row-num { display: none; }
  .row:hover .row-play { display: block; }
  .row .row-actions { opacity: 0; }
  .row:hover .row-actions, .row.is-playing .row-actions { opacity: 1; }
  .row .row-like { opacity: 0; }
  .row:hover .row-like, .row.is-liked .row-like { opacity: 1; }

  /* dropzone pulse */
  @keyframes dropPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(30,215,96,0.5); } 50% { box-shadow: 0 0 0 6px rgba(30,215,96,0); } }
  .dropzone { animation: dropPulse 1.6s ease-in-out infinite; }

  /* Tail-ed circles for now-playing pulse */
  .pulse-dot { position: relative; }
  .pulse-dot::after { content:''; position:absolute; inset:-4px; border-radius:999px; border:2px solid #1ED760; opacity:0.6; animation: ringPulse 1.6s ease-out infinite; }
  @keyframes ringPulse { 0% { transform: scale(0.8); opacity: 0.7; } 100% { transform: scale(1.4); opacity: 0; } }

  /* Subtle gradient bg for app shell */
  .app-shell { background: linear-gradient(180deg, #000 0%, #0a0a0a 100%); }

  /* Album art tile pattern */
  .art-shape { position: absolute; border-radius: 999px; mix-blend-mode: overlay; }

  /* Card hover */
  .lift:hover { transform: translateY(-2px); }
  .lift { transition: transform .18s ease; }

  /* Highlighted dropzone state in playlists */
  .playlist-row.drop-active {
    background: rgba(30,215,96,0.12);
    outline: 1.5px dashed #1ED760;
    outline-offset: -2px;
  }
</style>
